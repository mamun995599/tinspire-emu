name: Build TiNspire Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Signing config. Set these 4 repository secrets to sign with your own key
      # (Settings > Secrets and variables > Actions). If they are missing, a
      # temporary keystore is generated so the release APK is still signed.
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'tinspireemu' }}
      KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            unzip \
            wget \
            build-essential \
            python3-pip

      # Qt 5.15.2's Gradle (5.6.x) does not run on JDK 17, so use JDK 11
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      # Older cmdline-tools release that still runs on JDK 11
      - name: Setup Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-32" \
            "build-tools;32.0.0"

      - name: Install NDK r21e
        run: |
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r21e" >> $GITHUB_ENV

      - name: Install Python aqtinstall
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall

      - name: Install Qt 5.15.2 for Android
        run: |
          aqt install-qt \
            linux \
            android \
            5.15.2 \
            android \
            -O "$HOME/Qt"
          echo "QT=$HOME/Qt/5.15.2/android" >> $GITHUB_ENV
          echo "$HOME/Qt/5.15.2/android/bin" >> $GITHUB_PATH

      - name: Check gif-h submodule
        run: |
          git submodule update --init --recursive
          if [ ! -f "core/gif-h/gif.h" ]; then
            echo "gif-h submodule missing, cloning manually..."
            rm -rf core/gif-h
            git clone https://github.com/jacobly0/gif-h core/gif-h
          fi

      - name: Configure with qmake
        run: |
          mkdir -p build
          cd build
          "$QT/bin/qmake" .. \
            ANDROID_ABIS="arm64-v8a armeabi-v7a"

      - name: Compile
        run: |
          cd build
          make -j"$(nproc)"

      # Copies the .so files into android-build/libs/<abi>/
      - name: Install build targets
        run: |
          cd build
          make apk_install_target

      - name: Build debug APK
        run: |
          cd build
          SETTINGS=$(find . -maxdepth 1 -name 'android-*-deployment-settings.json' | head -n1)
          "$QT/bin/androiddeployqt" --gradle --android-platform android-32 \
            --input "$SETTINGS" --output android-build
          APK=$(find android-build/build/outputs/apk/debug -name '*.apk' | head -n1)
          mkdir -p ../dist
          cp "$APK" ../dist/tinspire-emu-debug.apk

      - name: Build release APK (unsigned)
        run: |
          cd build
          SETTINGS=$(find . -maxdepth 1 -name 'android-*-deployment-settings.json' | head -n1)
          "$QT/bin/androiddeployqt" --release --gradle --android-platform android-32 \
            --input "$SETTINGS" --output android-build
          APK=$(find android-build/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Unsigned release APK: $APK"
          cp "$APK" "$RUNNER_TEMP/release-unsigned.apk"

      - name: Prepare keystore
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "Using keystore from repository secrets"
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No signing secrets set - generating a temporary keystore. Updates signed with a different key cannot be installed over this APK."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=TiNspire Emu, O=TiNspire, C=BD"
          fi

      - name: Align and sign release APK
        run: |
          BT="$ANDROID_HOME/build-tools/32.0.0"
          "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/release-unsigned.apk" "$RUNNER_TEMP/release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out dist/tinspire-emu-release.apk \
            "$RUNNER_TEMP/release-aligned.apk"
          "$BT/apksigner" verify --print-certs dist/tinspire-emu-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tinspire-emu-apks
          path: |
            dist/tinspire-emu-debug.apk
            dist/tinspire-emu-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            dist/tinspire-emu-debug.apk
            dist/tinspire-emu-release.apk
